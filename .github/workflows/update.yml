name: Propose platform updates
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: platform-update-proposal
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository != 'Lanrith/config-template'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Propose verified production-qualified inputs
        run: python3 scripts/update-platform.py
      - id: proposal
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/lanrith-platform
          title: Review Lanrith platform and workflow update
          commit-message: Propose verified Lanrith platform and workflow pins
          body: |
            Verify the platform version, immutable source and workflow commits, security assessment
            identity and artifact digests. This proposal does not approve or merge itself.
          add-paths: |
            platform.lock
            .github/workflows/build.yml
            .github/workflows/check.yml
      - name: Explicitly check the bot-created proposal
        if: steps.proposal.outputs.pull-request-number
        run: gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref automation/lanrith-platform
