name: Build router
on:
  push:
    branches: [main]
    paths:
      - config.yaml
      - platform.lock
      - extensions.lock
      - extensions/**
      - trust/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    if: github.repository != 'Lanrith/config-template' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    uses: Lanrith/lanrith/.github/workflows/consumer.yml@a4f3a18efa8d24e625c049a1762182e0d7ea40bd
    with:
      publish: true
