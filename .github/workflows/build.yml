name: Build router
on:
  push:
    branches: [main]
    paths:
      - config.yaml
      - platform.lock
      - extensions.lock
      - extensions/**
      - trust/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    if: github.repository != 'Lanrith/config-template'
    permissions:
      contents: write
      actions: read
    uses: Lanrith/lanrith/.github/workflows/consumer.yml@238fc9a46f6d073c3a9853a3b3e96e7aac924956
    with:
      publish: true
